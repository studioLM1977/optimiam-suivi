<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SAB-STENIR — Suivi</title>
<meta name="theme-color" content="#1b1712">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-row">
      <span class="brand">SAB-STENIR</span>
      <span class="date" id="today-label"></span>
    </div>
    <div class="tagline" id="tagline-label"></div>
  </div>

  <section class="view active" id="view-dashboard"></section>
  <section class="view" id="view-ajouter"></section>
  <section class="view" id="view-historique"></section>
  <section class="view" id="view-panique"></section>
  <section class="view" id="view-ia"></section>
  <section class="view" id="view-reglages"></section>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" id="modal-close" title="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="search-overlay" id="search-overlay">
    <div class="search-overlay-header">
      <button type="button" class="search-overlay-close" id="search-overlay-close" title="Fermer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
      <input type="text" id="search-overlay-input" placeholder="Rechercher...">
    </div>
    <div class="chip-row" id="search-overlay-chips"></div>
    <div class="search-overlay-results" id="search-overlay-results"></div>
  </div>

  <nav class="bottom-nav">
    <button data-view="dashboard" class="active"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><rect x="6" y="10.5" width="12" height="9.5" rx="1.2"/><line x1="10" y1="20" x2="10" y2="14"/><line x1="14" y1="20" x2="14" y2="14"/><line x1="10" y1="14" x2="14" y2="14"/></svg></span>Accueil</button>
    <button data-view="ajouter"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="2" x2="7" y2="8"/><line x1="9.5" y1="2" x2="9.5" y2="8"/><line x1="12" y1="2" x2="12" y2="8"/><line x1="7" y1="8" x2="12" y2="8"/><line x1="9.5" y1="8" x2="9.5" y2="21"/><rect x="14" y="2" width="4" height="9" rx="2"/><line x1="16" y1="11" x2="16" y2="21"/></svg></span>Repas</button>
    <button data-view="historique"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 6h6v6"/></svg></span>Historique</button>
    <button data-view="panique"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.2" stroke-dasharray="2.4 3.4"/><circle cx="12" cy="12" r="10.6" stroke-dasharray="1.6 3.6" opacity="0.55"/></svg></span>Panique</button>
    <button data-view="ia"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="3"/><path d="M8 16v4l5-4"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="11" x2="13" y2="11"/></svg></span>IA</button>
    <button data-view="reglages"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="4" x2="6" y2="20"/><circle cx="6" cy="9" r="2"/><line x1="12" y1="4" x2="12" y2="20"/><circle cx="12" cy="15" r="2"/><line x1="18" y1="4" x2="18" y2="20"/><circle cx="18" cy="7" r="2"/></svg></span>Réglages</button>
  </nav>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
